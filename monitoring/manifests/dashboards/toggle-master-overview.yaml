            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 16,
          "type": "bargauge",
          "title": "Idade dos pods (min) — cai para perto de 0 quando o auto-reparo reinicia um serviço",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "(time() - kube_pod_created{namespace=\"toggle-app\"}) / 60",
              "legendFormat": "{{pod}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "min": 0,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 17,
          "type": "row",
          "title": "Logs em tempo real (Loki)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 44
          },
          "panels": []
        },
        {
          "id": 18,
          "type": "logs",
          "title": "Logs do namespace toggle-app",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 45
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{k8s_namespace_name=\"toggle-app\"}",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "prettifyLogMessage": false
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Linhas de log com erro por serviço (por minuto)",
          "description": "",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 56
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (k8s_container_name) (count_over_time({k8s_namespace_name=\"toggle-app\"} |~ \"(?i)(error|erro|panic|fail)\" [1m]))",
              "legendFormat": "{{k8s_container_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12,
