apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: toggle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      serviceAccountName: evaluation-service
      containers:
      - name: evaluation-service
        image: 339712930081.dkr.ecr.us-east-1.amazonaws.com/toggle-master-evaluation:latest
        ports:
        - containerPort: 8004
        resources: # Importante para o HPA conseguir medir uso de CPU depois!
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        # --- OpenTelemetry: tudo vai para o OTel Collector (namespace monitoring) ---
        - name: OTEL_SERVICE_NAME
          value: "evaluation-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.monitoring.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=toggle-master,deployment.environment=demo"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        - name: PORT
          value: "8004"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_URL
        - name: AWS_SQS_URL
          value: "https://sqs.us-east-1.amazonaws.com/339712930081/toggle-master-queue" # copie do output "sqs_queue_url" do terraform apply
        - name: AWS_REGION
          value: "us-east-1"
        - name: FLAG_SERVICE_URL
          value: "http://flag-service:8002"
        - name: TARGETING_SERVICE_URL
          value: "http://targeting-service:8003"
        - name: SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SERVICE_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: toggle-app
spec:
  ports:
  - port: 8004
    targetPort: 8004
  selector:
    app: evaluation-service
---
# Identidade AWS do pod (EKS Pod Identity). O nome precisa bater com
# aws_eks_pod_identity_association.evaluation no Terraform (modules/workload-iam).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service
  namespace: toggle-app