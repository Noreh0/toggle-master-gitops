apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: toggle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      serviceAccountName: analytics-service
      containers:
      - name: analytics-service
        image: 339712930081.dkr.ecr.us-east-1.amazonaws.com/toggle-master-analytics:v1.0.0-d1798e5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        # --- OpenTelemetry: tudo vai para o OTel Collector (namespace monitoring) ---
        - name: OTEL_SERVICE_NAME
          value: "analytics-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.monitoring.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=toggle-master,deployment.environment=demo"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SQS_URL
          value: "https://sqs.us-east-1.amazonaws.com/339712930081/toggle-master-queue" # mesma fila do evaluation (output sqs_queue_url)
        - name: AWS_DYNAMODB_TABLE
          value: "ToggleMasterAnalytics" # precisa bater exatamente com o nome criado no Terraform (modules/dynamodb)
---
# Identidade AWS do pod (EKS Pod Identity). O nome precisa bater com
# aws_eks_pod_identity_association.analytics no Terraform (modules/workload-iam).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: toggle-app