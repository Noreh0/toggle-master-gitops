apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: toggle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
      - name: targeting-service
        image: 339712930081.dkr.ecr.us-east-1.amazonaws.com/toggle-master-targeting:v1.0.0-d1798e5
        ports:
        - containerPort: 8003
        env:
        # --- OpenTelemetry: tudo vai para o OTel Collector (namespace monitoring) ---
        - name: OTEL_SERVICE_NAME
          value: "targeting-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.monitoring.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=toggle-master,deployment.environment=demo"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        - name: PORT
          value: "8003"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TARGETING_DB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: toggle-app
spec:
  ports:
  - port: 8003
    targetPort: 8003
  selector:
    app: targeting-service