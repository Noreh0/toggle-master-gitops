apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: toggle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
      - name: flag-service
        image: 339712930081.dkr.ecr.us-east-1.amazonaws.com/toggle-master-flag:v1.0.0-a62a64f
        ports:
        - containerPort: 8002
        env:
        # --- OpenTelemetry: tudo vai para o OTel Collector (namespace monitoring) ---
        - name: OTEL_SERVICE_NAME
          value: "flag-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.monitoring.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=toggle-master,deployment.environment=demo"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        - name: PORT
          value: "8002"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: FLAG_DB_URL
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: toggle-app
spec:
  ports:
  - port: 8002
    targetPort: 8002
  selector:
    app: flag-service