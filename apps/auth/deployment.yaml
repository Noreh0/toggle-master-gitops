apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toggle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 339712930081.dkr.ecr.us-east-1.amazonaws.com/toggle-master-auth:v1.0.0-097523b
        ports:
        - containerPort: 8001
        env:
        # --- OpenTelemetry: tudo vai para o OTel Collector (namespace monitoring) ---
        - name: OTEL_SERVICE_NAME
          value: "auth-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.monitoring.svc.cluster.local:4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=toggle-master,deployment.environment=demo"
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: "http"
        # Habilita POST /admin/chaos (protegido pela MASTER_KEY) para a demo de auto-recuperação.
        - name: ENABLE_CHAOS
          value: "true"
        - name: PORT
          value: "8001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_DB_URL
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MASTER_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: toggle-app
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: auth-service